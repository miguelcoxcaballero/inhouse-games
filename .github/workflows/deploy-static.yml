name: Deploy the static Inhouse website

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: inhouse-static-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy and verify the public website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: false
      - name: Cancel obsolete deployment queues
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          legacy_pages=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=gh-pages&per_page=50" --jq '.workflow_runs[] | select(.name == "pages build and deployment" and (.status == "queued" or .status == "in_progress" or .status == "waiting")) | .id')
          for run_id in $legacy_pages; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
          done
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          old_releases=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=50" --jq ".workflow_runs[] | select(.path == \".github/workflows/publish.yml\" and .head_sha != \"$main_sha\" and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\")) | .id")
          for run_id in $old_releases; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
          done
      - name: Use Actions to deploy the existing Pages site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! site_info=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>&1); then
            echo "::error::Cannot read this repository's Pages configuration: ${site_info//$'\n'/ }"
            exit 1
          fi
          mode=$(printf '%s' "$site_info" | node -e 'let data="";process.stdin.on("data",value=>data+=value);process.stdin.on("end",()=>console.log(JSON.parse(data).build_type))')
          if [ "$mode" != workflow ]; then
            if ! result=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow 2>&1); then
              echo "::error::Cannot configure the existing Pages deployment: ${result//$'\n'/ }"
              exit 1
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the published page, its assets and available downloads
        env:
          PUBLIC_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const site = new URL(process.env.PUBLIC_SITE_URL);
          if (site.protocol !== 'https:') throw new Error('Pages did not return an HTTPS URL.');
          if (!site.pathname.endsWith('/')) site.pathname += '/';
          const expected = JSON.parse(await fs.readFile('release.json', 'utf8').catch(() => 'null'));
          let failure;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const page = await fetch(new URL(`?published=${Date.now()}`, site), { cache: 'no-store', signal: AbortSignal.timeout(10000) });
              if (!page.ok) throw new Error(`Website HTTP ${page.status}.`);
              const html = await page.text();
              if (!html.includes('inhouse')) throw new Error('The public page is not the Inhouse application.');
              for (const match of html.matchAll(/(?:src|href)="([^"\s]+\.(?:js|css)(?:\?[^"\s]*)?)"/g)) {
                const asset = new URL(match[1], site);
                if (asset.origin !== site.origin || !asset.pathname.startsWith(site.pathname)) throw new Error('A website asset escapes its Pages path.');
                if (!(await fetch(asset, { signal: AbortSignal.timeout(10000) })).ok) throw new Error('A public application asset is missing.');
              }
              if (expected) {
                const response = await fetch(new URL(`release.json?published=${Date.now()}`, site), { cache: 'no-store', signal: AbortSignal.timeout(10000) });
                if (!response.ok) throw new Error('The public download manifest is missing.');
                const actual = await response.json();
                if (actual.tag !== expected.tag || actual.publishedAt !== expected.publishedAt) throw new Error('The CDN still serves an older download manifest.');
                for (const key of ['web', 'source']) {
                  const file = actual.downloads?.[key];
                  if (!file) continue;
                  if (file.sha256 !== expected.downloads?.[key]?.sha256 || file.url !== expected.downloads?.[key]?.url) throw new Error('The public download metadata does not match the deployment.');
                  const download = await fetch(file.url, { signal: AbortSignal.timeout(30000) });
                  if (!download.ok) throw new Error(`The ${key} download returned HTTP ${download.status}.`);
                  const bytes = Buffer.from(await download.arrayBuffer());
                  if (bytes.length !== file.size || createHash('sha256').update(bytes).digest('hex') !== file.sha256) throw new Error(`The ${key} download failed its checksum.`);
                }
              }
              console.log(`::notice title=Public website verified::${site.href} returned HTTP 200; application assets and available download checksums passed.`);
              process.exit(0);
            } catch (error) {
              failure = error.message;
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          console.error(`::error title=Public website verification failed::${failure}`);
          process.exitCode = 1;
          JS
