name: Verify and publish inhouse link

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/deploy-static.yml'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inhouse-link-release-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify web, signaling and real WebRTC
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the distribution's signed coturn package
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y coturn
      - name: Install the matching Playwright Chromium
        run: |
          npx --no-install playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('@playwright/test').chromium.executablePath())" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/release-manifest.test.mjs scripts/publication-helpers.test.mjs
      - run: npm run test:e2e -- --reporter=list,github
      - run: npm run build
      - name: Retain failing browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inhouse-link-browser-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  windows:
    name: Build the Windows portable app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:windows
        env:
          VITE_BASE_PATH: /
      - name: Compile the actual Windows input helper without injecting input
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File desktop/input-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: inhouse-link-windows
          path: |
            artifacts/Inhouse-Link-Windows.exe
            artifacts/Inhouse-Link-Windows.exe.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish verified downloads and the website
    if: github.ref == 'refs/heads/main'
    needs: [verify, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: inhouse-link-windows
          path: artifacts
      - run: npm ci
      - name: Build the independent web service package at its root
        run: |
          npm run build
          python3 scripts/package-web.py
          python3 scripts/package-source.py
        env:
          VITE_BASE_PATH: /
      - name: Publish an immutable tagged release and verify public assets
        id: release
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Refuse an obsolete website deployment
        id: current
        if: steps.release.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          current_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$GITHUB_SHA" = "$current_sha" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "The immutable release is published; current main will deploy the website."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the website with its verified release catalog
        if: steps.current.outputs.publish == 'true'
        run: |
          npm run build
          touch dist/.nojekyll
        env:
          VITE_BASE_PATH: /inhouse-games/
          VITE_SIGNALING_URL: ${{ vars.VITE_SIGNALING_URL }}
      - name: Publish the current website branch
        if: steps.current.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: dist
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false
      - name: Deploy the static branch without waiting for another push event
        if: steps.current.outputs.publish == 'true'
        run: gh workflow run deploy-static.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the public website and its actual available downloads
        if: steps.current.outputs.publish == 'true'
        run: node scripts/check-website.mjs
        env:
          PUBLIC_SITE_URL: ${{ vars.INHOUSE_LINK_SITE_URL || 'https://miguelcoxcaballero.github.io/inhouse-games/' }}
